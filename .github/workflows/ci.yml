name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
    inputs:
      hydra-lsp-ref:
        description: 'Branch or tag of m-lyon/hydra-lsp to build against.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the extension
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Bundle
        run: npm run package

      - name: Unit tests
        run: npm test

  # The PowerShell archive extraction only runs on Windows. Lint, types and
  # the bundle don't depend on the OS, so the Linux job covers those.
  windows:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out the extension
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  integration:
    name: Contract and table audit
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the extension
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: hydrust-vscode

      # Which server to build against.
      #
      # Both suites here expect a v0.4.0-or-later server: the contract suite
      # needs the experimental.hydrust block, and two of the table audit checks
      # read the working tree for behaviour that is new in v0.4.0.
      - name: Check out the hydra-lsp server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          repository: m-lyon/hydra-lsp
          ref: ${{ inputs.hydra-lsp-ref || vars.HYDRA_LSP_REF || 'main' }}
          path: hydra-lsp
          # The table audit reads the tagged sources, so it needs the tags.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hydrust-vscode/package-lock.json

      - name: Install dependencies
        working-directory: hydrust-vscode
        run: npm ci

      # This action has no version tags, only moving branches, so it is pinned
      # by commit. The comment says which branch that commit came from. The
      # branch is rebuilt often, so an old pin drops off it; move the pin to the
      # current branch head when zizmor reports `impostor-commit`. A SHA ref does
      # not name the toolchain, so the input sets it.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: hydra-lsp

      - name: Build the server
        working-directory: hydra-lsp
        run: cargo build

      # No HYDRA_LSP_BINARY here: the suite looks in the sibling checkout's
      # target/debug itself, which is the same path, and finds the binary under
      # either name. Pinning it to one name would break on the rename.
      - name: Contract tests against the built server
        working-directory: hydrust-vscode
        run: npm run test:contract

      - name: Audit the compatibility table against the tagged sources
        working-directory: hydrust-vscode
        env:
          HYDRA_LSP_REPO: ${{ github.workspace }}/hydra-lsp
        run: npm run test:table-audit

  zizmor:
    name: Workflow security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the extension
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: zizmor
        run: uvx zizmor@1.32.0 --format=github .
        env:
          GH_TOKEN: ${{ github.token }}
