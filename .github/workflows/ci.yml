name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
    inputs:
      hydra-lsp-ref:
        description: 'Branch or tag of m-lyon/hydra-lsp to build against.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the extension
        uses: actions/checkout@v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Bundle
        run: npm run package

      - name: Unit tests
        run: npm test

  integration:
    name: Contract and table audit
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the extension
        uses: actions/checkout@v6.1.0
        with:
          path: hydrust-vscode

      # Which server to build against.
      #
      # Both suites here expect a v0.4.0-or-later server: the contract suite
      # needs the experimental.hydrust block, and two of the table audit checks
      # read the working tree for behaviour that is new in v0.4.0.
      - name: Check out the hydra-lsp server
        uses: actions/checkout@v6.1.0
        with:
          repository: m-lyon/hydra-lsp
          ref: ${{ inputs.hydra-lsp-ref || vars.HYDRA_LSP_REF || 'main' }}
          path: hydra-lsp
          # The table audit reads the tagged sources, so it needs the tags.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hydrust-vscode/package-lock.json

      - name: Install dependencies
        working-directory: hydrust-vscode
        run: npm ci

      # This action has no version tags, only moving branches, so it is pinned
      # by commit. The comment says which branch that commit came from.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2.8.2
        with:
          workspaces: hydra-lsp

      - name: Build the server
        working-directory: hydra-lsp
        run: cargo build

      - name: Contract tests against the built server
        working-directory: hydrust-vscode
        env:
          HYDRA_LSP_BINARY: ${{ github.workspace }}/hydra-lsp/target/debug/hydra-lsp
        run: npm run test:contract

      - name: Audit the compatibility table against the tagged sources
        working-directory: hydrust-vscode
        env:
          HYDRA_LSP_REPO: ${{ github.workspace }}/hydra-lsp
        run: npm run test:table-audit
