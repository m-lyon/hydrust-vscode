name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

jobs:
  # Builds and tests the .vsix. Third-party npm code runs here, so this job
  # has no access to the Marketplace token.
  build:
    name: Package and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # No cache in release jobs: a cache written by another run could
          # change what gets published.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # Only the packaged build gets the new pin; the committed value stays as a
      # working floor. Runs before the bundle is built by vsce's prepublish step.
      - name: Pin the fallback server version to the newest complete release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pin-server-version.mjs

      - name: Type-check pinned constants
        run: npx tsc --noEmit

      - name: Package extension
        run: npx vsce package

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  # Publishes the .vsix built above. The token lives in the protected `release`
  # environment, which needs a maintainer's approval and accepts only `v*` tags.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://marketplace.visualstudio.com/items?itemName=m-lyon.hydrust
    permissions:
      contents: write
    steps:
      - name: Check out the extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # vsce at the locked version. --ignore-scripts stops dependency install
      # scripts from running in the job that holds the token.
      - name: Install dependencies without install scripts
        run: npm ci --ignore-scripts

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath *.vsix

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            *.vsix
