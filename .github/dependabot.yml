version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised
    # release has time to be found and pulled.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # @types/vscode sets the lowest VS Code version the extension supports
    # (engines.vscode), so it only changes on purpose.
    ignore:
      - dependency-name: "@types/vscode"
      # typescript-eslint doesn't support TypeScript 7 yet (its peer range
      # stops below 6.1). Drop this once it does.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
